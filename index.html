<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>宝贝成长照片挑选 · 给爸爸专属通道 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #12131c;
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部横幅 */
    header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      padding: 30px 20px 25px 20px;
      text-align: center;
      box-shadow: 0 4px 25px rgba(255, 117, 140, 0.35);
      border-radius: 0 0 24px 24px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.85rem;
      color: #fff;
      font-weight: 800;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
      margin-bottom: 8px;
    }
    p.guide {
      color: #fff0f5;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    /* 阶段导航栏 */
    .nav-bar {
      position: sticky;
      top: 0;
      background: rgba(18, 19, 28, 0.95);
      backdrop-filter: blur(15px);
      z-index: 90;
      padding: 12px 15px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .nav-btn {
      flex: 1;
      white-space: nowrap;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ddd;
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: #ff477e;
      border-color: #ff477e;
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
    }

    /* 分类标签切换（美照 / 丑照） */
    .sub-filter {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0 20px 0;
      padding: 0 15px;
      flex-wrap: wrap;
    }
    .sub-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #bbb;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sub-btn.active {
      background: #ffd166;
      color: #222;
      font-weight: bold;
      border-color: #ffd166;
    }

    /* 瀑布流/照片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
      padding: 0 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
      h1 { font-size: 2.3rem; }
    }

    /* 照片卡片 */
    .photo-card {
      background: #1c1e2d;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid transparent;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    .photo-card.selected {
      border-color: #ff477e;
      box-shadow: 0 0 18px rgba(255, 71, 126, 0.45);
    }
    .img-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      background: #25283b;
      cursor: pointer;
      overflow: hidden;
    }
    @media (min-width: 600px) {
      .img-wrap { height: 240px; }
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .photo-card:hover .img-wrap img {
      transform: scale(1.04);
    }

    .badge-year {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: #ffd166;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .card-meta {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title {
      font-size: 0.88rem;
      color: #eee;
      font-weight: 500;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .card-tags {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 600;
    }
    .tag-mei {
      background: rgba(255, 71, 126, 0.2);
      color: #ff758c;
    }
    .tag-chou {
      background: rgba(255, 209, 102, 0.2);
      color: #ffd166;
    }

    /* 大爱心收藏按钮 */
    .btn-heart {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-heart.checked {
      background: #ff477e;
      border-color: #fff;
      color: #fff;
      transform: scale(1.15);
      box-shadow: 0 4px 12px rgba(255, 71, 126, 0.6);
    }

    /* 底部悬浮操作栏 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(18, 19, 28, 0.96);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .counter-info {
      font-size: 1.05rem;
      color: #ffd166;
      font-weight: bold;
    }
    .submit-btn {
      background: linear-gradient(135deg, #06d6a0 0%, #1b9aaa 100%);
      color: #fff;
      border: none;
      padding: 13px 26px;
      border-radius: 35px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(6, 214, 160, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .submit-btn:active { transform: scale(0.96); }

    /* 大图弹窗 */
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    #lightbox img {
      max-width: 95vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 10px;
    }
    .lightbox-title {
      color: #ffd166;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 12px;
    }
    .close-tip {
      color: #aaa;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    /* 成功弹窗 */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: #1f2233;
      border-radius: 20px;
      padding: 30px 24px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-box h2 {
      color: #06d6a0;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    .modal-box p {
      color: #ddd;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .text-preview {
      background: #141622;
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 12px;
      text-align: left;
      font-size: 0.9rem;
      color: #ffd166;
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .modal-btn {
      background: #ff477e;
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 爸爸的专属选图通道 ✨</h1>
    <p class="guide">
      爸爸您好！全量 178 张照片已全部整理好啦（2017-2026年）<br />
      遇到喜欢的，点一下右上角的 <b>❤️ 爱心</b> 就能挑中！
    </p>
  </header>

  <!-- 年龄大阶段导航 -->
  <div class="nav-bar">
    <button class="nav-btn active" id="btn-stage-1" onclick="switchStage('1_小', this)">👶 小 (0-2岁 · 63张)</button>
    <button class="nav-btn" id="btn-stage-2" onclick="switchStage('2_中', this)">🧸 中 (3-5岁 · 30张)</button>
    <button class="nav-btn" id="btn-stage-3" onclick="switchStage('3_大', this)">🎒 大 (6-9岁 · 85张)</button>
  </div>

  <!-- 美照 / 搞怪 切换 -->
  <div class="sub-filter">
    <button class="sub-btn active" onclick="switchCat('all', this)">全部看</button>
    <button class="sub-btn" onclick="switchCat('美照', this)">🌸 漂漂亮亮美照</button>
    <button class="sub-btn" onclick="switchCat('丑照', this)">🤪 搞怪幽默瞬间</button>
  </div>

  <!-- 照片瀑布流 -->
  <div class="grid" id="grid"></div>

  <!-- 底部悬浮控制台 -->
  <div class="bottom-bar">
    <div class="counter-info">
      已挑好: <span id="count" style="font-size: 1.4rem;">0</span> 张
    </div>
    <button class="submit-btn" onclick="submitSelection()">
      选好啦！发给儿子 🚀
    </button>
  </div>

  <!-- 点击看大图 -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" />
    <div class="lightbox-title" id="lightbox-title"></div>
    <div class="close-tip">（点击任意处返回）</div>
  </div>

  <!-- 提交成功弹窗 -->
  <div id="modal">
    <div class="modal-box">
      <h2>🎉 太棒啦！已发送成功！</h2>
      <p>选好的照片清单已经通过云端<b>实时同步给在国外的儿子</b>啦！</p>
      <div class="text-preview" id="text-preview"></div>
      <p style="font-size: 0.95rem; color: #aaa; margin-bottom: 15px;">
        （同时已将文字复制到剪贴板，爸爸也可直接去微信粘贴发给儿子）
      </p>
      <button class="modal-btn" onclick="closeModal()">好的，我知道啦！</button>
    </div>
  </div>

  <script>
    // 云端同步通道（国内与海外均可畅通访问）
    const SYNC_CHANNEL = 'hzy-baby-photos-2026';
    let photoData = [];
    let curStage = '1_小';
    let curCat = 'all';
    const selected = new Map(); // filename -> item

    // 加载数据
    fetch('photos.json')
      .then(res => res.json())
      .then(data => {
        photoData = data;
        updateCounts();
        render();
      })
      .catch(err => {
        console.error('加载照片失败:', err);
      });

    function updateCounts() {
      const c1 = photoData.filter(p => p.stage_code === '1_小').length;
      const c2 = photoData.filter(p => p.stage_code === '2_中').length;
      const c3 = photoData.filter(p => p.stage_code === '3_大').length;
      document.getElementById('btn-stage-1').innerText = `👶 小 (0-2岁 · ${c1}张)`;
      document.getElementById('btn-stage-2').innerText = `🧸 中 (3-5岁 · ${c2}张)`;
      document.getElementById('btn-stage-3').innerText = `🎒 大 (6-9岁 · ${c3}张)`;
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      photoData.forEach(p => {
        if (!p.stage.startsWith(curStage)) return;
        if (curCat !== 'all' && p.category !== curCat) return;

        const isChecked = selected.has(p.filename);
        const card = document.createElement('div');
        card.className = 'photo-card ' + (isChecked ? 'selected' : '');

        card.innerHTML = `
          <div class="img-wrap" onclick="openLightbox('${encodeURI(p.path)}', '${p.year}年 · ${p.title}')">
            <span class="badge-year">${p.year}年</span>
            <button class="btn-heart ${isChecked ? 'checked' : ''}" onclick="toggleSelect(event, '${p.filename}')">
              ${isChecked ? '❤️' : '🤍'}
            </button>
            <img src="${encodeURI(p.path)}" alt="${p.title}" loading="lazy" />
          </div>
          <div class="card-meta">
            <div class="card-title">${p.title}</div>
            <div class="card-tags">
              <span class="tag ${p.category === '美照' ? 'tag-mei' : 'tag-chou'}">${p.category === '美照' ? '🌸 美照' : '🤪 搞怪'}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleSelect(e, filename) {
      e.stopPropagation();
      if (selected.has(filename)) {
        selected.delete(filename);
      } else {
        const item = photoData.find(p => p.filename === filename);
        if (item) selected.set(filename, item);
      }

      document.getElementById('count').innerText = selected.size;
      render();
    }

    function switchStage(stage, btn) {
      curStage = stage;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function switchCat(cat, btn) {
      curCat = cat;
      document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function openLightbox(src, title) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-title').innerText = title || '';
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    // 提交挑选结果（云端实时回传 + 剪贴板双保险）
    function submitSelection() {
      if (selected.size === 0) {
        alert('爸爸，您还没有点爱心挑照片呢！\n看到喜欢的照片，点一下右上角的 ❤️ 就可以挑中啦！');
        return;
      }

      const listArr = Array.from(selected.values());
      const textMessage = `【爸爸挑好的照片清单（共 ${listArr.length} 张）】：\n` + 
        listArr.map((item, idx) => `${idx + 1}. [${item.year}年·${item.category}] ${item.title}`).join('\n');

      // 1. 发送给云端同步通道（儿子在国外直接能看到）
      fetch(`https://ntfy.sh/${SYNC_CHANNEL}`, {
        method: 'POST',
        headers: {
          'Title': `=?UTF-8?B?${btoa(unescape(encodeURIComponent(`爸爸挑选好了 ${listArr.length} 张照片！`)))}?=`,
          'Tags': 'tada,heart,baby'
        },
        body: textMessage
      }).catch(e => console.log('Sync err:', e));

      // 2. 自动复制到剪贴板，方便爸爸微信粘贴
      if (navigator.clipboard) {
        navigator.clipboard.writeText(textMessage).catch(() => {});
      }

      // 3. 弹窗提示
      document.getElementById('text-preview').innerText = textMessage;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
