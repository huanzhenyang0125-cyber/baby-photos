<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>宝贝成长照片挑选 · 给爸爸专属通道 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #12131c;
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding-bottom: 120px;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部横幅 */
    header {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      padding: 30px 20px 25px 20px;
      text-align: center;
      box-shadow: 0 4px 25px rgba(255, 117, 140, 0.35);
      border-radius: 0 0 24px 24px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.85rem;
      color: #fff;
      font-weight: 800;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
      margin-bottom: 8px;
    }
    p.guide {
      color: #fff0f5;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    /* 阶段导航栏 */
    .nav-bar {
      position: sticky;
      top: 0;
      background: rgba(18, 19, 28, 0.95);
      backdrop-filter: blur(15px);
      z-index: 90;
      padding: 12px 15px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .nav-btn {
      flex: 1;
      white-space: nowrap;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ddd;
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: #ff477e;
      border-color: #ff477e;
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
    }

    /* 分类标签切换（美照 / 丑照） */
    .sub-filter {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0 20px 0;
      padding: 0 15px;
      flex-wrap: wrap;
    }
    .sub-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #bbb;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sub-btn.active {
      background: #ffd166;
      color: #222;
      font-weight: bold;
      border-color: #ffd166;
    }

    /* 瀑布流/照片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
      padding: 0 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
      h1 { font-size: 2.3rem; }
    }

    /* 照片卡片 */
    .photo-card {
      background: #1c1e2d;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid transparent;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
    }
    .photo-card.selected {
      border-color: #ff477e;
      box-shadow: 0 0 18px rgba(255, 71, 126, 0.45);
    }
    .photo-card.sent {
      border-color: #06d6a0;
      box-shadow: 0 0 18px rgba(6, 214, 160, 0.45);
    }

    .img-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      background: #25283b;
      cursor: pointer;
      overflow: hidden;
    }
    @media (min-width: 600px) {
      .img-wrap { height: 240px; }
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .photo-card:hover .img-wrap img {
      transform: scale(1.04);
    }

    .badge-year {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: #ffd166;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .tag-sent {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: #06d6a0;
      color: #12131c;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(6, 214, 160, 0.5);
      z-index: 5;
      display: none;
    }
    .photo-card.sent .tag-sent {
      display: inline-block;
    }

    .card-meta {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title {
      font-size: 0.88rem;
      color: #eee;
      font-weight: 500;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .card-tags {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tag {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 600;
    }
    .tag-mei {
      background: rgba(255, 71, 126, 0.2);
      color: #ff758c;
    }
    .tag-chou {
      background: rgba(255, 209, 102, 0.2);
      color: #ffd166;
    }

    /* 大爱心收藏按钮 */
    .btn-heart {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border: 2px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-heart.checked {
      background: #ff477e;
      border-color: #fff;
      color: #fff;
      transform: scale(1.15);
      box-shadow: 0 4px 12px rgba(255, 71, 126, 0.6);
    }

    /* 底部悬浮操作栏 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(18, 19, 28, 0.96);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .counter-info {
      font-size: 1.05rem;
      color: #ffd166;
      font-weight: bold;
    }
    .submit-btn {
      background: linear-gradient(135deg, #06d6a0 0%, #1b9aaa 100%);
      color: #fff;
      border: none;
      padding: 13px 26px;
      border-radius: 35px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(6, 214, 160, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .submit-btn:active { transform: scale(0.96); }

    /* 大图弹窗 */
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      cursor: pointer;
    }
    #lightbox img {
      max-width: 95vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 10px;
    }
    .lightbox-title {
      color: #ffd166;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 12px;
    }
    .close-tip {
      color: #aaa;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    /* 发送成功客户端图文确认弹窗 */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #1c1e2d;
      border-radius: 24px;
      padding: 26px 20px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(6, 214, 160, 0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 214, 160, 0.15);
      color: #06d6a0;
      border: 1px solid #06d6a0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      margin: 0 auto 10px auto;
    }
    .modal-box h2 {
      color: #fff;
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .modal-desc {
      color: #ddd;
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    /* 弹窗内的照片缩略图画廊 */
    .modal-gallery-title {
      font-size: 0.92rem;
      color: #ffd166;
      font-weight: bold;
      text-align: left;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .modal-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 10px;
      max-height: 40vh;
      overflow-y: auto;
      padding: 10px;
      background: #12131c;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 14px;
    }
    .modal-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #25283b;
      border: 1.5px solid #06d6a0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    .modal-thumb img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      display: block;
    }
    .modal-thumb .thumb-check {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #06d6a0;
      color: #12131c;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .modal-thumb .thumb-year {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0,0,0,0.75);
      color: #ffd166;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 6px;
    }

    .modal-tip {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .modal-btn {
      background: linear-gradient(135deg, #06d6a0 0%, #1b9aaa 100%);
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
    }
    .modal-btn:hover {
      transform: scale(1.02);
    }

    /* 顶部 Toast 提示 */
    #toast {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #06d6a0;
      color: #12131c;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(6, 214, 160, 0.4);
      z-index: 4000;
    }
  </style>
</head>
<body>

  <div id="toast"></div>

  <header>
    <h1>✨ 爸爸的专属选图通道 ✨</h1>
    <p class="guide">
      爸爸您好！全量 178 张照片已全部整理好啦（2017-2026年）<br />
      遇到喜欢的，点一下右上角的 <b>❤️ 爱心</b> 就能挑中！
    </p>
  </header>

  <!-- 年龄大阶段导航 -->
  <div class="nav-bar">
    <button class="nav-btn active" id="btn-stage-1" onclick="switchStage('1_小', this)">👶 小 (0-2岁 · 63张)</button>
    <button class="nav-btn" id="btn-stage-2" onclick="switchStage('2_中', this)">🧸 中 (3-5岁 · 30张)</button>
    <button class="nav-btn" id="btn-stage-3" onclick="switchStage('3_大', this)">🎒 大 (6-9岁 · 85张)</button>
  </div>

  <!-- 美照 / 搞怪 切换 -->
  <div class="sub-filter">
    <button class="sub-btn active" onclick="switchCat('all', this)">全部看</button>
    <button class="sub-btn" onclick="switchCat('美照', this)">🌸 漂漂亮亮美照</button>
    <button class="sub-btn" onclick="switchCat('丑照', this)">🤪 搞怪幽默瞬间</button>
  </div>

  <!-- 照片瀑布流 -->
  <div class="grid" id="grid"></div>

  <!-- 底部悬浮控制台 -->
  <div class="bottom-bar">
    <div class="counter-info">
      已挑好: <span id="count" style="font-size: 1.4rem;">0</span> 张
    </div>
    <button class="submit-btn" onclick="submitSelection()">
      选好啦！发给儿子 🚀
    </button>
  </div>

  <!-- 点击看大图 -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" />
    <div class="lightbox-title" id="lightbox-title"></div>
    <div class="close-tip">（点击任意处返回）</div>
  </div>

  <!-- 提交成功客户端大图文确认弹窗 -->
  <div id="modal">
    <div class="modal-box">
      <div class="modal-badge">✅ 发送成功反馈</div>
      <h2>🎉 已同步给儿子！</h2>
      <p class="modal-desc" id="modal-desc">
        爸爸您挑好的照片已通过云端实时传给在国外的儿子啦！
      </p>

      <div class="modal-gallery-title">
        <span>📸 已成功发送的照片清单（可点击放大）：</span>
        <span id="modal-photo-count">0 张</span>
      </div>

      <!-- 客户端图文缩略图画廊 -->
      <div class="modal-gallery" id="modal-gallery"></div>

      <p class="modal-tip">
        儿子在国外可以直接打开高清画廊查看每一张照片，无需重复发送。<br />
        （清单文字也已自动复制到剪贴板，微信可直接粘贴备用）
      </p>
      <button class="modal-btn" onclick="closeModal()">好的，我知道啦！</button>
    </div>
  </div>

  <script>
    const SYNC_CHANNEL = 'hzy-baby-photos-2026';
    let photoData = [];
    let curStage = '1_小';
    let curCat = 'all';
    const selected = new Map(); // filename -> item
    const sentSet = new Set(JSON.parse(localStorage.getItem('sent_photos') || '[]'));

    // 加载数据
    fetch('photos.json')
      .then(res => res.json())
      .then(data => {
        photoData = data;
        updateCounts();
        render();
      })
      .catch(err => {
        console.error('加载照片失败:', err);
      });

    function updateCounts() {
      const c1 = photoData.filter(p => p.stage_code === '1_小').length;
      const c2 = photoData.filter(p => p.stage_code === '2_中').length;
      const c3 = photoData.filter(p => p.stage_code === '3_大').length;
      document.getElementById('btn-stage-1').innerText = `👶 小 (0-2岁 · ${c1}张)`;
      document.getElementById('btn-stage-2').innerText = `🧸 中 (3-5岁 · ${c2}张)`;
      document.getElementById('btn-stage-3').innerText = `🎒 大 (6-9岁 · ${c3}张)`;
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      photoData.forEach(p => {
        if (!p.stage.startsWith(curStage)) return;
        if (curCat !== 'all' && p.category !== curCat) return;

        const isChecked = selected.has(p.filename);
        const isSent = sentSet.has(p.filename);
        const card = document.createElement('div');
        card.className = 'photo-card ' + (isChecked ? 'selected ' : '') + (isSent ? 'sent ' : '');

        card.innerHTML = `
          <div class="img-wrap" onclick="openLightbox('${encodeURI(p.path)}', '${p.year}年 · ${p.title}')">
            <span class="badge-year">${p.year}年</span>
            <span class="tag-sent">✓ 已发送</span>
            <button class="btn-heart ${isChecked ? 'checked' : ''}" onclick="toggleSelect(event, '${p.filename}')">
              ${isChecked ? '❤️' : '🤍'}
            </button>
            <img src="${encodeURI(p.path)}" alt="${p.title}" loading="lazy" />
          </div>
          <div class="card-meta">
            <div class="card-title">${p.title}</div>
            <div class="card-tags">
              <span class="tag ${p.category === '美照' ? 'tag-mei' : 'tag-chou'}">${p.category === '美照' ? '🌸 美照' : '🤪 搞怪'}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleSelect(e, filename) {
      e.stopPropagation();
      if (selected.has(filename)) {
        selected.delete(filename);
      } else {
        const item = photoData.find(p => p.filename === filename);
        if (item) selected.set(filename, item);
      }

      document.getElementById('count').innerText = selected.size;
      render();
    }

    function switchStage(stage, btn) {
      curStage = stage;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function switchCat(cat, btn) {
      curCat = cat;
      document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function openLightbox(src, title) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-title').innerText = title || '';
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    // 提交挑选结果（客户端图文展示 + 云端画廊链接直达）
    function submitSelection() {
      if (selected.size === 0) {
        alert('爸爸，您还没有点爱心挑照片呢！\n看到喜欢的照片，点一下右上角的 ❤️ 就可以挑中啦！');
        return;
      }

      const listArr = Array.from(selected.values());
      const idList = listArr.map(item => item.id).join(',');
      const reviewUrl = `https://huanzhenyang0125-cyber.github.io/baby-photos/review.html?ids=${idList}`;

      // 标记为已发送
      listArr.forEach(item => sentSet.add(item.filename));
      localStorage.setItem('sent_photos', JSON.stringify(Array.from(sentSet)));

      const textMessage = `【爸爸挑好的照片清单（共 ${listArr.length} 张）】：\n` + 
        listArr.map((item, idx) => `${idx + 1}. [${item.year}年·${item.category}] ${item.title}`).join('\n') +
        `\n\n👉 儿子专属在线大图画廊：\n${reviewUrl}`;

      // 1. 发送给云端通道（带直达 Review 画廊链接和操作按钮）
      fetch(`https://ntfy.sh/${SYNC_CHANNEL}`, {
        method: 'POST',
        headers: {
          'Title': `=?UTF-8?B?${btoa(unescape(encodeURIComponent(`爸爸挑选好了 ${listArr.length} 张照片！`)))}?=`,
          'Tags': 'tada,heart,camera',
          'Click': reviewUrl,
          'Actions': `view, 📷 点击直接看爸爸挑中的照片图文画廊, ${reviewUrl}`
        },
        body: textMessage
      }).catch(e => console.log('Sync err:', e));

      // 2. 自动复制到剪贴板
      if (navigator.clipboard) {
        navigator.clipboard.writeText(textMessage).catch(() => {});
      }

      // 3. 客户端立即展示这批照片的图文缩略图反馈！
      renderModalGallery(listArr);
      document.getElementById('modal-desc').innerText = `爸爸您挑好的 ${listArr.length} 张照片已经成功发送给儿子啦！`;
      document.getElementById('modal-photo-count').innerText = `${listArr.length} 张`;
      document.getElementById('modal').style.display = 'flex';

      showToast(`✅ 成功发送 ${listArr.length} 张照片给儿子！`);
      render();
    }

    // 在弹窗中渲染所有被挑选照片的缩略图
    function renderModalGallery(photos) {
      const container = document.getElementById('modal-gallery');
      container.innerHTML = '';

      photos.forEach(p => {
        const thumb = document.createElement('div');
        thumb.className = 'modal-thumb';
        thumb.title = `${p.year}年 · ${p.title} (点击放大查看)`;
        thumb.onclick = () => openLightbox(encodeURI(p.path), `${p.year}年 · ${p.title}`);

        thumb.innerHTML = `
          <div class="thumb-check">✓</div>
          <span class="thumb-year">${p.year}年</span>
          <img src="${encodeURI(p.path)}" alt="${p.title}" />
        `;
        container.appendChild(thumb);
      });
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
